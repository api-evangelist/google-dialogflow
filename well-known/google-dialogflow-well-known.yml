  Dialogflow console host and the OAuth authorization server that the Dialogflow securitySchemes
  name (accounts.google.com). Two real documents were found: Google's RFC 9116 security.txt on
  google.com, and the OpenID Connect / RFC 8414 discovery pair on accounts.google.com, which is the
  authorization server every Dialogflow OAuth flow actually talks to. The Dialogflow product hosts
  themselves serve nothing at /.well-known/.

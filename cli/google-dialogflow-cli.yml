name: gcloud alpha dialogflow
description: >-
  Dialogflow has no standalone CLI. Its command surface ships inside the Google Cloud CLI (gcloud)
  as the `gcloud alpha dialogflow` command group — "interact with and manage Dialogflow agents,
  entities, and intents". The surface covers Dialogflow ES only; there is no gcloud command group
  for Dialogflow CX / Conversational Agents, which is managed through the API, the console, or the
  client libraries. The group is still marked ALPHA (Google's own page: "This command is currently
  in alpha and might change without notice"), which is a material caveat for anyone scripting
  against it.
maturity: alpha

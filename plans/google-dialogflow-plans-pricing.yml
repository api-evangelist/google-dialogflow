specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Dialogflow
providerId: google-dialogflow
generated: '2026-09-12'
method: searched
source: https://cloud.google.com/dialogflow/pricing
created: '2026-05-04'
modified: '2026-09-12'
description: >-
  Dialogflow / Conversational Agents pricing, read from Google's own pricing page on 2026-09-12.
  This replaces a 2026-05-04 scaffold whose Free/Professional/Enterprise tiers and TBD prices were
  placeholder defaults that matched nothing Google publishes. Dialogflow does not sell subscription
  tiers: it is pure pay-as-you-go usage billing on a Google Cloud account, priced per request for
  chat agents and per second of audio for voice agents. The only tier-shaped distinction is the ES
  Trial vs Essentials edition split, which is a quota and SLA boundary rather than a price list.
billing_model: usage-based
currency: USD
plan_count: 5
plans:
- id: google-dialogflow-cx-flows-chat
  name: Conversational Agents — Flows (Dialogflow CX), chat
  type: usage
  description: Deterministic agents built with intents and flows using NLU, billed per request on
    text conversations.
  entries:
  - label: Chat requests
    name: chat_requests
    type: metered
    metric: requests
    unit: 1
    price: '0.007'
    currency: USD
    timeFrame: null
    domains:
    - https://dialogflow.googleapis.com
  elements:
  - name: Flows
  - name: Intents and NLU
  - name: Pages and routes
  - name: Webhooks
- id: google-dialogflow-cx-flows-voice
  name: Conversational Agents — Flows (Dialogflow CX), voice
  type: usage
  description: The same Flows edition billed per second of audio. Billed time per turn is input
    seconds (agent listening, including barge-in) plus output seconds (the full generated response,
    whether or not playback is interrupted), rounded up to the nearest second.
  entries:
  - label: Voice seconds
    name: voice_seconds
    type: metered
    metric: seconds
    unit: 1
    price: '0.001'
    currency: USD
    domains:
    - https://dialogflow.googleapis.com
- id: google-dialogflow-cx-playbooks-chat
  name: Conversational Agents — Playbooks, chat
  type: usage
  description: Generative agents built from natural-language instructions using playbooks, data
    stores, generators and generative fallback.
  entries:
  - label: Chat requests
    name: chat_requests
    type: metered
    metric: requests
    unit: 1
    price: '0.012'
    currency: USD
    domains:
    - https://dialogflow.googleapis.com
  elements:
  - name: Playbooks
  - name: Data Stores
  - name: Generators
  - name: Generative fallback
- id: google-dialogflow-cx-playbooks-voice
  name: Conversational Agents — Playbooks, voice
  type: usage
  entries:
  - label: Voice seconds
    name: voice_seconds
    type: metered
    metric: seconds
    unit: 1
    price: '0.002'
    currency: USD
    domains:
    - https://dialogflow.googleapis.com
- id: google-dialogflow-data-store-index-storage
  name: Data store index storage
  type: usage
  description: Storage for indexed data-store content, computed on the total size of the raw data
    sampled regularly and averaged for the month. Refresh operations are not charged. Website data
    stores are computed as 500 KiB per page.
  entries:
  - label: Included storage
    name: included_storage
    type: quota
    metric: GiB
    limit: 10
    timeFrame: month
    unit: 1
    price: '0.00'
    currency: USD
  - label: Additional storage
    name: overage_storage
    type: metered
    metric: GiB
    unit: 1
    price: '5.00'
    currency: USD
    timeFrame: month
free_tier:
  design_time_requests:
    price: '0.00'
    note: Design-time requests are free of charge — navigating the visual builder, listing agent
      resources, and similar. Only runtime conversation requests are billed.
  trial_credits:
  - name: Conversational Agents (Flows)
    amount: '600.00'
    currency: USD
    expires_after: 12 months
    note: Activates automatically on first use by a new user.
  - name: Conversational Agents (Playbooks)
    amount: '1000.00'
    currency: USD
    expires_after: 12 months
  dialogflow_es_trial_edition:
    price: '0.00'
    note: >-
      Dialogflow ES has a free Trial Edition with reduced quotas (180 text rpm, 1000 audio
      requests/day) and no SLA coverage, versus the paid Essentials Edition. See
      rate-limits/google-dialogflow-rate-limits.yml.
billing_definitions:
  turn: A single interaction within a conversation — one user input paired with one agent response.
  request: Any API call to the platform, direct via the API or indirect via an integration or the
    console.
  session: A conversation between an end user and an agent; chat sessions use text, voice sessions
    use audio.
hybrid_billing:
  note: >-
    Billing aggregates per turn and each turn is billed by the features it consumed. If a Flow calls
    a Playbook, only the Playbook turns are billed at the Playbook rate. If a Playbook calls a Flow,
    the ENTIRE conversation is billed at the Playbook rate — a material asymmetry for anyone costing
    a hybrid agent.
enterprise:
  custom_quote: https://cloud.google.com/contact
  note: Custom quotes are available; no published enterprise price list.
calculator: https://cloud.google.com/products/calculator
notes:
- Dialogflow ES is priced on a separate page linked from the Conversational Agents pricing page.
- There is no free monthly request allowance on CX beyond the one-time trial credits and the free
  10 GiB of data-store index storage.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

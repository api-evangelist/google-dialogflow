  dialogflow_cx: true
  dialogflow_es: false
  evidence: https://cloud.google.com/dialogflow/docs/compliance-security-controls
  note: CX only. Dialogflow ES carries no FedRAMP authorization — a real difference between the two
    editions for public-sector buyers.

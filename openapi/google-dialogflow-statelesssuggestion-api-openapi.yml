        similarityScore:
          type: number
          format: float
          readOnly: true
        answerRecord:
          type: string
          readOnly: true
        suggestionIndex:
          type: integer
          format: int32
          readOnly: true
    GoogleCloudDialogflowV2CesAppSpec:
      type: object
      properties:
        proactiveEnabled:
          type: boolean
        cesApp:
          type: string
        confirmationRequirement:
          type: string
          enum:
          - CONFIRMATION_REQUIREMENT_UNSPECIFIED
          - REQUIRED
          - NOT_REQUIRED
          x-enumDescriptions:
          - ''
          - ''
          - ''
        reactiveEnabled:
          type: boolean
    GoogleCloudDialogflowV2ConversationContextReference:
      type: object
      properties:
        createTime:
          type: string
          format: date-time
          readOnly: true
        languageCode:
          type: string
        updateMode:
          type: string
          enum:
          - UPDATE_MODE_UNSPECIFIED
          - APPEND
          - OVERWRITE
          x-enumDescriptions:
          - ''
          - ''
          - ''
        contextContents:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDialogflowV2ConversationContextReferenceContextContent'
    GoogleCloudDialogflowV2Generator:
      type: object
      properties:
        triggerEvent:
          type: string
          enum:
          - TRIGGER_EVENT_UNSPECIFIED
          - END_OF_UTTERANCE
          - MANUAL_CALL
          - CUSTOMER_MESSAGE
          - AGENT_MESSAGE
          x-enumDescriptions:
          - ''
          - ''
          - ''
          - ''
          - ''
        createTime:
          type: string
          format: date-time
          readOnly: true
        toolsetTools:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDialogflowV2ToolsetTool'
        inferenceParameter:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2InferenceParameter'
        updateTime:
          type: string
          format: date-time
          readOnly: true
        tools:
          type: array
          items:
            type: string
        freeFormContext:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2FreeFormContext'
        agentCoachingContext:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2AgentCoachingContext'
        description:
          type: string
        summarizationContext:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2SummarizationContext'
        suggestionDedupingConfig:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2SuggestionDedupingConfig'
        cesToolSpecs:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDialogflowV2CesToolSpec'
        cesAppSpecs:
          type: array
          items:
            $ref: '#/components/schemas/GoogleCloudDialogflowV2CesAppSpec'
        publishedModel:
          type: string
        name:
          type: string
          readOnly: true
    GoogleCloudDialogflowV2AgentCoachingInstruction:
      type: object
      properties:
        duplicateCheckResult:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2AgentCoachingInstructionDuplicateCheckResult'
        displayName:
          type: string
        agentAction:
          type: string
        systemAction:
          type: string
        displayDetails:
          type: string
        condition:
          type: string
        triggeringEvent:
          type: string
          enum:
          - TRIGGER_EVENT_UNSPECIFIED
          - END_OF_UTTERANCE
          - MANUAL_CALL
          - CUSTOMER_MESSAGE
          - AGENT_MESSAGE
          - TOOL_CALL_COMPLETION
          x-enumDescriptions:
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''

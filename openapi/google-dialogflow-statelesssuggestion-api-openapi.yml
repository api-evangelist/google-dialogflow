          - SITUATION
          - ACTION
          - RESOLUTION
          - REASON_FOR_CANCELLATION
          - CUSTOMER_SATISFACTION
          - ENTITIES
          - CUSTOMER_DEFINED
          - SITUATION_CONCISE
          - ACTION_CONCISE
          x-enumDescriptions:
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''

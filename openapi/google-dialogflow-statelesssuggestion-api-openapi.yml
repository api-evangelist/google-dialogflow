          $ref: '#/components/schemas/GoogleCloudDialogflowV2ToolCall'
        toolCallResult:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2ToolCallResult'
    GoogleCloudDialogflowV2SummarizationSection:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
          enum:

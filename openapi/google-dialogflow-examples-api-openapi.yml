          format: int32
        details:
          type: array
          items:
            type: object
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
    GoogleCloudDialogflowCxV3Example:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        playbookInput:

          items:
            $ref: '#/components/schemas/GoogleCloudDialogflowCxV3Action'
        languageCode:
          type: string
        createTime:
          type: string
          format: date-time
          readOnly: true
        displayName:
          type: string
    GoogleCloudDialogflowCxV3PlaybookOutput:
      type: object
      properties:
        executionSummary:
          type: string
    GoogleCloudDialogflowCxV3PlaybookInvocation:
      type: object
      properties:
        playbook:
          type: string
        displayName:
          type: string
          readOnly: true
        playbookState:
          type: string
          enum:
          - OUTPUT_STATE_UNSPECIFIED
          - OUTPUT_STATE_OK
          - OUTPUT_STATE_CANCELLED
          - OUTPUT_STATE_FAILED
          - OUTPUT_STATE_ESCALATED
          - OUTPUT_STATE_PENDING
          x-enumDescriptions:
          - ''

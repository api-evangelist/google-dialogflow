          format: int64
          readOnly: true
        updateTime:
          type: string
          format: date-time
          readOnly: true
        conversationState:
          type: string
          enum:
          - OUTPUT_STATE_UNSPECIFIED
          - OUTPUT_STATE_OK
          - OUTPUT_STATE_CANCELLED
          - OUTPUT_STATE_FAILED
          - OUTPUT_STATE_ESCALATED
          - OUTPUT_STATE_PENDING

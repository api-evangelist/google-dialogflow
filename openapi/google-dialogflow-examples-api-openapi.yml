    GoogleProtobufEmpty:
      type: object
    GoogleCloudDialogflowCxV3PlaybookInput:
      type: object
      properties:
        precedingConversationSummary:
          type: string
    GoogleCloudDialogflowCxV3FlowTransition:
      type: object
      properties:
        flow:
          type: string
        displayName:
          type: string
          readOnly: true
    GoogleCloudDialogflowCxV3ToolUse:
      type: object
      properties:
        inputActionParameters:

        code:
          type: integer
          format: int32
        details:
          type: array
          items:
            type: object
            additionalProperties:
              description: Properties of the object. Contains field @type with type URL.
    GoogleCloudDialogflowV2Document:
      type: object
      properties:
        state:
          type: string
          enum:
          - STATE_UNSPECIFIED

          - ACTIVE
          - UPDATING
          - RELOADING
          - DELETING
          x-enumDescriptions:
          - ''
          - ''
          - ''
          - ''
          - ''
          - ''
          readOnly: true
        name:
          type: string
        displayName:
          type: string
        latestReloadStatus:
          $ref: '#/components/schemas/GoogleCloudDialogflowV2DocumentReloadStatus'
        mimeType:
          type: string
        knowledgeTypes:
          type: array
          items:
            type: string
            enum:
            - KNOWLEDGE_TYPE_UNSPECIFIED
            - FAQ
            - EXTRACTIVE_QA
            - ARTICLE_SUGGESTION
            - AGENT_FACING_SMART_REPLY
            x-enumDescriptions:
            - ''
            - ''
            - ''
            - ''
            - ''
        enableAutoReload:
          type: boolean
        rawContent:
          type: string
          format: byte
        metadata:
          type: object
          additionalProperties:
            type: string
        contentUri:
          type: string
    GoogleCloudDialogflowV2DocumentReloadStatus:
      type: object
      properties:
        time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/GoogleRpcStatus'

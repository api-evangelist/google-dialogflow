      properties:
        mimeType:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        knowledgeTypes:
          type: array
          items:
            type: string
            enum:
            - KNOWLEDGE_TYPE_UNSPECIFIED
            - FAQ
            - EXTRACTIVE_QA
            - ARTICLE_SUGGESTION

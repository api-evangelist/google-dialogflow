notes:
- Any real server would inherit the operation parameters and request bodies from openapi/ as its
  inputSchema; nothing here needs to be invented.
- Auth would be OAuth 2.0 with https://www.googleapis.com/auth/dialogflow — there is no API-key
  path.
- The design-time write quota (60 requests per minute) is the binding constraint on any agent doing
  bulk authoring through such a server.

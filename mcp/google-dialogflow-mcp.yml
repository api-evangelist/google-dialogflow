provider: Google Dialogflow
providerId: google-dialogflow
status: candidate
description: >-
  Google ships NO Model Context Protocol server for Dialogflow. The tool list below is an API
  Evangelist candidate derived from operations that genuinely exist in the two converted OpenAPIs —
  every `rest:` operationId can be grepped out of openapi/. It is a proposal for what a Dialogflow
  MCP server should expose, not a description of something callable today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    Searched npm (dialogflow mcp), the GoogleCloudPlatform and googleapis GitHub orgs, and the
    Dialogflow documentation on 2026-09-12. GoogleCloudPlatform publishes MCP servers for Cloud Run,
    GKE, BigQuery, Cluster Director and Gemini Cloud Assist — but none for Dialogflow or
    Conversational Agents. The only Dialogflow-named MCP repositories on GitHub are third party
    (ag2-mcp-servers/dialogflow-api, machine-generated; KemingHe/nodejs-dialogflow-cx-companion-mcp-server,
    archived by its author) and neither is recorded here as a provider surface.
direction_note: >-
  Worth distinguishing: Dialogflow CX is an MCP/tool CONSUMER story, not an MCP provider one.
  Its `tools` resource (up to 100 per agent) lets an agent you build call external APIs, and
  playbooks orchestrate those calls. That is Dialogflow reaching out. Nothing in the contract lets
  an external MCP client reach in.
candidate_tools:
- name: dialogflow_detect_intent
  category: runtime
  description: Send a text or audio turn to a CX agent session and get the agent's response.
  rest:
  - dialogflow_projects_locations_agents_sessions_detectIntent
  - dialogflow_projects_locations_agents_environments_sessions_detectIntent
  consequence: billable — each call is a charged conversation turn
- name: dialogflow_es_detect_intent
  category: runtime
  description: Send a turn to a Dialogflow ES agent session.
  rest:
  - dialogflow_projects_agent_sessions_detectIntent
  - dialogflow_projects_locations_agent_sessions_detectIntent
  consequence: billable
- name: dialogflow_match_intent
  category: runtime
  description: Return the intents a query would match, without running fulfillment or advancing the
    session.
  rest:
  - dialogflow_projects_locations_agents_sessions_matchIntent
  consequence: read-only against session state
